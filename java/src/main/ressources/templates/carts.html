<!-- html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>All Carts</title>
</head>
<body>
<h1>Saved Carts</h1>

<table>
    <thead>
    <tr><th>Cart id</th><th>Action</th></tr>
    </thead>
    <tbody>
    <tr th:each="entry : ${carts}">
        <td th:text="${entry.key}">cart-id</td>
        <td>
            <a th:href="@{/carts/{id}(id=${entry.key})}">View</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
